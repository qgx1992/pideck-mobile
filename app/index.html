<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#18181b" />
    <title>PiDeck</title>
    <!-- 首帧前先把主题写到 <html>，避免深色用户看到一瞬白屏 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("pideck-app-theme");
          var dark = saved === "dark" || (saved !== "light" && !window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          try {
            if (window.Capacitor && window.Capacitor.getPlatform() === "android") {
              document.documentElement.dataset.platform = "android";
            }
          } catch (e) {}
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#18181b" : "#f7f7f9");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      /* 启动动画：内联在这里，保证在 JS/CSS 包加载前就能画出来。
         否则深色主题下会先闪一帧白屏。 */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(120% 80% at 50% 38%, #232329 0%, #0c0c0e 72%);
        color: #e7e7ea;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        opacity: 1;
        transition: opacity 300ms ease, transform 300ms ease;
      }
      :root[data-theme="light"] #splash {
        background: radial-gradient(120% 80% at 50% 38%, #ffffff 0%, #e9e9ef 72%);
        color: #1c1c22;
      }
      #splash.is-leaving {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }

      .splash-mark {
        position: relative;
        width: 92px;
        height: 92px;
        display: grid;
        place-items: center;
      }
      .splash-mark img {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        opacity: 0;
        transform: scale(0.82);
        animation: splash-in 460ms cubic-bezier(0.22, 1, 0.36, 1) 60ms forwards;
      }
      /* 绕图标转一圈的光环，暗示「正在启动」而不是卡住 */
      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #4f8cff;
        border-right-color: rgba(79, 140, 255, 0.35);
        animation: splash-spin 1.1s linear infinite;
        opacity: 0.9;
      }
      @keyframes splash-in {
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }

      .splash-name {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.22em;
        text-indent: 0.22em;
        opacity: 0;
        animation: splash-fade 420ms ease 240ms forwards;
      }
      .splash-hint {
        min-height: 14px;
        font-size: 11.5px;
        letter-spacing: 0.04em;
        color: #9a9aa4;
        opacity: 0;
        animation: splash-fade 420ms ease 380ms forwards;
      }
      :root[data-theme="light"] .splash-hint { color: #6b6b76; }
      @keyframes splash-fade {
        to { opacity: 1; }
      }

      /* 进度条：不确定态（来回滑动），不需要真实进度 */
      .splash-bar {
        width: 108px;
        height: 2px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(154, 154, 164, 0.22);
        opacity: 0;
        animation: splash-fade 420ms ease 380ms forwards;
      }
      .splash-bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #4f8cff, transparent);
        animation: splash-slide 1.15s ease-in-out infinite;
      }
      @keyframes splash-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(310%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-ring,
        .splash-bar::after { animation: none; }
        .splash-mark img,
        .splash-name,
        .splash-hint,
        .splash-bar { animation-duration: 1ms; opacity: 1; transform: none; }
      }
    </style>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="splash" role="status" aria-label="正在启动">
      <div class="splash-mark">
        <span class="splash-ring"></span>
        <img src="./splash-icon.png" alt="" aria-hidden="true" />
      </div>
      <div class="splash-name">PIDECK</div>
      <div class="splash-bar"></div>
      <div class="splash-hint" id="splash-hint">正在启动…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
