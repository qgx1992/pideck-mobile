apply plugin: 'com.android.application'

// 发布签名配置：从 android/keystore.properties 读取（该文件与 keystore 都不入库）。
// 没有这个文件时 release 包不打签名，assembleRelease 仍然能跑通（产出 -unsigned.apk）。
def keystorePropsFile = rootProject.file("keystore.properties")
def hasReleaseKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseKeystore) {
    keystorePropsFile.withInputStream { stream -> keystoreProps.load(stream) }
}

// 允许 CI 用 -PpideckVersionName / -PpideckVersionCode 覆盖版本（本地构建走默认值）
def pideckVersionName = (project.findProperty("pideckVersionName") ?: "0.1.2").toString()
def pideckVersionCode = (project.findProperty("pideckVersionCode") ?: "102").toString().toInteger()

android {
    namespace "dev.pideck.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        // 安装身份与 Java 包名分开：namespace 仍是 dev.pideck.mobile（源码包不动），
        // 只把 applicationId 换成自己的域名，这样 release 包和旧的 debug 包能共存。
        applicationId "top.caoayu.pideck"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pideckVersionCode
        versionName pideckVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile", "pideck-release.keystore"))
                storePassword keystoreProps.getProperty("storePassword", "")
                keyAlias keystoreProps.getProperty("keyAlias", "pideck")
                keyPassword keystoreProps.getProperty("keyPassword", "")
            }
        }
    }
    buildTypes {
        debug {
            // 加后缀：debug 包（top.caoayu.pideck.debug）和签名 release 包可以同时装在一台手机上
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            // 扫码插件带来 ML Kit 的原生库 libbarhopper_v3.so（每个 ABI 3~6 MB）。
            // 真机只有 arm，release 裁掉 x86/x86_64（模拟器用 debug 包）。
            // 四个 ABI 全留：debug 27 MB → release 12 MB 左右。
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
}

if (!hasReleaseKeystore) {
    logger.lifecycle("· 未找到 android/keystore.properties：release 包将不签名（先跑 npm run gen:keystore）")
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/google' }
    maven { url 'https://maven.aliyun.com/repository/public' }
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
