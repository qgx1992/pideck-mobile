name: Android Release

# 出签名 APK 并挂到 Release。
#
#   - push tag v*        → 构建并把 APK 传到该 tag 的 Release（没有就创建）
#   - workflow_dispatch  → 只构建并产出 artifact，不碰 Release（用来验证流水线）
#
# 构建的是 native/（Kotlin/Compose 原生客户端，0.5.0 起接管 top.caoayu.pideck），
# 不再是 app/ 那个 WebView 壳（0.4.x 已停止发布）。
#
# 需要的 repository secrets（都是只写，不进日志）：
#   ANDROID_KEYSTORE_BASE64     pideck-release.keystore 的 base64
#   ANDROID_KEYSTORE_PROPERTIES keystore.properties 的完整内容
#   （native/app/build.gradle.kts 从仓库根的 ../keys/ 读这两个文件，所以写到 keys/）

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则用 native/app/build.gradle.kts 里的 versionName）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          # 只认行首的声明：defaultConfig 上面的注释里也写着 "versionCode = …"，宽松匹配会抓错
          DECLARED="$(grep -E '^[[:space:]]*versionName[[:space:]]*=' native/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$DECLARED"
          fi
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::warning::tag/输入版本 ${VERSION} 与 gradle 里的 ${DECLARED} 不一致，以 ${VERSION} 命名产物"
          fi
          CODE="$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' native/app/build.gradle.kts | head -1 | grep -oE '[0-9]+' | head -1)"
          if [ -z "${DECLARED}" ] || [ -z "${CODE}" ]; then
            echo "::error::没能从 native/app/build.gradle.kts 解析出 versionName / versionCode"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "构建版本 ${VERSION}（versionCode=${CODE}，取自 gradle）"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 不用 android-actions/setup-android：它在当前 runner 镜像上会去装
      # 已被移除的 'tools' 包而直接失败（Failed to find package 'tools'）。
      # ubuntu-latest 自带 Android SDK，这里只补齐本项目需要的 platform/build-tools。
      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          if [ -n "$SDKMANAGER" ]; then
            yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK" \
              "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: 还原签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEYSTORE_PROPERTIES}" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PROPERTIES secrets"
            exit 1
          fi
          mkdir -p keys
          echo "${KEYSTORE_BASE64}" | base64 -d > keys/pideck-release.keystore
          printf '%s\n' "${KEYSTORE_PROPERTIES}" > keys/keystore.properties
          chmod 600 keys/pideck-release.keystore keys/keystore.properties

      # git 在 Windows 上不记录可执行位（gradlew 存成 100644），checkout 出来没有 +x，
      # 直接 ./gradlew 会 exit 126。
      - name: 确保 gradlew 可执行
        run: chmod +x native/gradlew

      - name: 单元测试
        working-directory: native
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: 构建签名 APK
        working-directory: native
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: 校验签名与标识
        id: verify
        run: |
          set -euo pipefail
          APK="native/app/build/outputs/apk/release/app-release.apk"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"
          AAPT="$(find "$SDK/build-tools" -name aapt2 -type f | sort -V | tail -1)"

          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          grep -qi "pideck" /tmp/certs.txt || { echo "::error::签名证书不对"; exit 1; }

          BADGING="$("$AAPT" dump badging "$APK" | head -3)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='top.caoayu.pideck'" || {
            echo "::error::applicationId 不是 top.caoayu.pideck"; exit 1;
          }
          echo "$BADGING" | grep -q "versionCode='${{ steps.version.outputs.code }}'" || {
            echo "::error::versionCode 与 gradle 不一致"; exit 1;
          }

          SHA="$(sha256sum "$APK" | cut -d' ' -f1)"
          NAME="PiDeck-${{ steps.version.outputs.version }}-release.apk"
          cp "$APK" "$NAME"
          printf '%s  %s\n' "$SHA" "$NAME" > SHA256SUMS.txt
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "file=${NAME}" >> "$GITHUB_OUTPUT"
          echo "✓ ${NAME}  sha256=${SHA}"

      - name: 清理签名材料
        if: always()
        run: rm -f keys/pideck-release.keystore keys/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: pideck-apk-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.verify.outputs.file }}
            SHA256SUMS.txt
          if-no-files-found: error

      - name: 上传到 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.verify.outputs.file }}
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          # 不传 body：已有 Release 的说明保持不变，只追加资产
